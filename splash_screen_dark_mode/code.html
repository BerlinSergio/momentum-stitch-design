<div class="absolute top-1/3 -left-20 w-72 h-72 bg-secondary/15 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-24 -right-16 w-80 h-80 bg-tertiary-container/15 rounded-full blur-[110px] pointer-events-none"></div>

</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant/60">nights_stay</span>

</div>
</div>
<!-- Center Branding Medallion & Hero Core -->
<div class="flex flex-col items-center justify-center my-auto w-full max-w-sm z-10 text-center">

<div class="absolute -inset-1 rounded-3xl bg-gradient-to-r from-primary/30 to-secondary/30 blur-md opacity-50"></div>

<div class="relative w-28 h-28 rounded-3xl bg-surface-container-lowest/80 backdrop-blur-2xl shadow-2xl shadow-surface-container-lowest flex items-center justify-center overflow-hidden transition-transform duration-500 hover:scale-105 active:scale-95">
<!-- Ambient Internal Refraction Lines -->
<div class="absolute inset-0 bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>
<div class="absolute -top-10 -right-10 w-20 h-20 bg-secondary/20 rounded-full blur-lg"></div>
<!-- Concentric Circular Ring Mark -->
<div class="relative w-16 h-16 rounded-full flex items-center justify-center">
<!-- Outer Pulsing Ring -->
<div class="absolute inset-0 rounded-full bg-secondary/10 animate-[spin_12s_linear_infinite]"></div>
<!-- Mid Concentric Orbital Ring -->
<div class="absolute inset-1.5 rounded-full bg-primary/20"></div>
<!-- Innermost Glowing Emblem Center -->
<div class="relative w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center shadow-[0_0_24px_rgba(76,215,246,0.5)]">
<span class="material-symbols-outlined text-surface-container-lowest text-[22px] transition-transform duration-300" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>

</div>

<h1 class="font-headline-md text-headline-md font-bold tracking-[0.25em] text-white uppercase drop-shadow-[0_2px_12px_rgba(255,255,255,0.15)]">
      MOMENTUM
    </h1>
<!-- Subtitle Definition -->
<p class="font-body-sm text-body-sm text-on-surface-variant font-medium mt-2.5 max-w-[260px] leading-relaxed">
      Spiritual tools, mindful finance &amp; daily routines
    </p>
<!-- Three Interactive Value Pills -->
<div class="flex items-center justify-center gap-2 mt-6">
<div class="bg-surface-container-high/60 backdrop-blur-md text-on-surface text-label-sm font-label-sm px-3.5 py-1.5 rounded-full shadow-sm hover:bg-surface-container-highest transition-colors cursor-default">
        Focus
      </div>
<div class="bg-surface-container-high/60 backdrop-blur-md text-secondary text-label-sm font-label-sm px-3.5 py-1.5 rounded-full shadow-sm hover:bg-surface-container-highest transition-colors cursor-default">
        Barakah
      </div>
<div class="bg-surface-container-high/60 backdrop-blur-md text-on-surface text-label-sm font-label-sm px-3.5 py-1.5 rounded-full shadow-sm hover:bg-surface-container-highest transition-colors cursor-default">
        Growth
      </div>
</div>
</div>
<!-- Bottom Loading & Progress Pod -->
<div class="w-full max-w-sm flex flex-col items-center gap-4 z-10 pb-2">

<div class="w-full bg-surface-container-low/70 backdrop-blur-xl rounded-2xl p-4 shadow-xl shadow-surface-container-lowest/80 transition-all">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2.5">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-secondary"></span>
</span>

</div>

</div>

<div class="bg-surface-container-highest rounded-full h-1.5 mt-3 overflow-hidden p-0.5">
<div class="bg-gradient-to-r from-primary-container via-primary to-secondary h-full rounded-full shadow-[0_0_12px_rgba(76,215,246,0.6)] transition-all duration-1000 ease-out" id="splash-progress-bar" style="width: 98%;">
</div>
</div>
</div>
<!-- Metadata App Signature -->
<div class="flex items-center gap-1.5 text-on-surface-variant/70 font-label-sm text-label-sm">
<span>v2.4.0</span>

<span class="tracking-wide">Crafted for intentional living</span>
</div>
</div>

<script>
  // Subtle interactive delight for the dark mode splash
  (function() {
    const emblem = document.getElementById('brand-emblem');
    const progressBar = document.getElementById('splash-progress-bar');
    const progressLabel = document.getElementById('progress-indicator');
    
    if (emblem) {
      emblem.addEventListener('pointerdown', () => {
        emblem.style.transform = 'scale(0.96)';
      });
      emblem.addEventListener('pointerup', () => {
        emblem.style.transform = 'scale(1)';
      });
      emblem.addEventListener('pointerleave', () => {
        emblem.style.transform = 'scale(1)';
      });
    }

    // Micro-shimmer completion cycle
    let completed = false;
    setTimeout(() => {
      if (progressBar && progressLabel && !completed) {
        completed = true;
        progressBar.style.width = '100%';
        progressLabel.textContent = '100%';
        progressLabel.classList.remove('text-primary');
        progressLabel.classList.add('text-secondary');
      }
    }, 1200);
  })();
